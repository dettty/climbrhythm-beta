<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ClimbRhythm Beta Guide</title>
<meta name="robots" content="noindex">
<style>
/* Layout: one reading column; install steps as the only numbered sequence, sports as a quiet two-column list. Colours follow the app's stone & sage. */
:root{--paper:#f1eee5;--surface:#e7e3d6;--ink:#293124;--muted:#5b6554;--green:#48603c;--line:#cfcabb;
  --display:"Avenir Next","Segoe UI",system-ui,sans-serif;--body:-apple-system,"Segoe UI",system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#1c211a;--surface:#262d23;--ink:#e9e8dc;--muted:#a7b09d;--green:#b5cf9a;--line:#3a4335;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#1c211a;--surface:#262d23;--ink:#e9e8dc;--muted:#a7b09d;--green:#b5cf9a;--line:#3a4335;color-scheme:dark}
*{box-sizing:border-box}
img{max-width:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
.page{max-width:44rem;margin:0 auto;padding-block:2rem 4rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:2.75rem}
header{display:flex;flex-direction:column;gap:1.25rem}
.top{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.75rem;font-family:var(--display);font-weight:600;font-size:1.1rem}
.brand img{width:44px;height:44px;border-radius:11px;display:block}
.lang{display:flex;flex-wrap:wrap;gap:.25rem}
.lang button{font:500 .85rem var(--body);color:var(--muted);background:none;border:1px solid var(--line);border-radius:999px;padding:.35rem .8rem;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--paper)}
.lang button:focus-visible,a:focus-visible,.copy:focus-visible{outline:2px solid var(--green);outline-offset:2px}
h1{font-family:var(--display);font-weight:600;font-size:clamp(1.9rem,6vw,2.6rem);line-height:1.1;letter-spacing:-.02em;margin:0;text-wrap:balance}
.lead{font-size:1.1rem;color:var(--muted);margin:0;max-width:36rem}
section{display:flex;flex-direction:column;gap:1rem}
h2{font-family:var(--display);font-weight:600;font-size:1.3rem;margin:0;text-wrap:balance}
p{margin:0;max-width:38rem}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.75rem;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:2rem 1fr;gap:.75rem;align-items:start}
.steps li::before{content:counter(s);font:600 .95rem var(--display);width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;background:var(--green);color:var(--paper)}
.steps div{min-width:0}
.link{background:var(--surface);border-radius:12px;padding:.9rem 1rem;display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;justify-content:space-between}
.link a{color:var(--green);font-weight:600;overflow-wrap:anywhere;min-width:0}
.copy{font:500 .85rem var(--body);color:var(--ink);background:none;border:1px solid var(--line);border-radius:999px;padding:.35rem .9rem;cursor:pointer}
dl{margin:0;display:grid;grid-template-columns:minmax(8rem,11rem) 1fr;column-gap:1.25rem;row-gap:.9rem;border-top:1px solid var(--line);padding-top:1rem}
dt{font-weight:600}
dd{margin:0;min-width:0;color:var(--ink)}
@media (max-width:520px){dl{grid-template-columns:1fr;row-gap:.25rem}dd{padding-bottom:.75rem}}
.note{color:var(--muted);font-size:.95rem}
.shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1rem;max-width:38rem}
.shots.two{max-width:25rem}
.shots.one{max-width:12rem}
figure{margin:0;display:flex;flex-direction:column;gap:.5rem;min-width:0}
figure img{display:block;width:100%;height:auto;border-radius:18px;border:1px solid var(--line);background:var(--surface)}
.watch img{border-radius:22%;border:6px solid #1b1b1b}
figcaption{font-size:.85rem;color:var(--muted);line-height:1.35}
.addr{font-weight:600;user-select:all;overflow-wrap:anywhere}
footer{border-top:1px solid var(--line);padding-top:1rem;color:var(--muted);font-size:.9rem}
.news{margin:0;padding-left:1.2rem;display:flex;flex-direction:column;gap:.4rem;max-width:38rem}
</style>
</head>

  <h1 data-de="So testest du ClimbRhythm" data-en="How to test ClimbRhythm" data-fr="Comment tester ClimbRhythm" data-es="Cómo probar ClimbRhythm" data-it="Come provare ClimbRhythm"></h1>
  <p class="lead" data-de="Ein Trainingstagebuch für Klettern, Bouldern, Hangboard, Kraft und Ausdauer – auf iPhone und Apple Watch. Diese Seite erklärt die Installation und was die App kann." data-en="A training log for climbing, bouldering, hangboarding, strength and endurance – on iPhone and Apple Watch. This page explains how to install it and what the app can do." data-fr="Un carnet d’entraînement pour l’escalade, le bloc, la poutre, la musculation et l’endurance – sur iPhone et Apple Watch. Cette page explique l’installation et ce que l’app sait faire." data-es="Un diario de entrenamiento para escalada, búlder, tabla multipresa, fuerza y resistencia, en iPhone y Apple Watch. Esta página explica la instalación y lo que puede hacer la app." data-it="Un diario di allenamento per arrampicata, boulder, trave, forza e resistenza – su iPhone e Apple Watch. Questa pagina spiega l’installazione e cosa sa fare l’app."></p>
</header>

<section>
  <h2 data-de="Installieren" data-en="Install" data-fr="Installer" data-es="Instalar" data-it="Installare"></h2>
  <ol class="steps">
    <li><div data-de="Lade „TestFlight“ aus dem App Store. Die App ist von Apple und kostenlos." data-en="Get “TestFlight” from the App Store. It is made by Apple and free." data-fr="Télécharge « TestFlight » sur l’App Store. L’app est d’Apple et gratuite." data-es="Descarga «TestFlight» del App Store. La app es de Apple y gratuita." data-it="Scarica «TestFlight» dall’App Store. L’app è di Apple ed è gratuita."></div></li>
    <li><div data-de="Öffne den Einladungslink, den du von Detlef bekommen hast, auf deinem iPhone und tippe auf „Installieren“." data-en="Open the invitation link you received from Detlef on your iPhone and tap “Install”." data-fr="Ouvre sur ton iPhone le lien d’invitation que Detlef t’a envoyé et touche « Installer »." data-es="Abre en tu iPhone el enlace de invitación que te ha enviado Detlef y toca «Instalar»." data-it="Apri sul tuo iPhone il link di invito che ti ha mandato Detlef e tocca «Installa»."></div></li>
    <li><div data-de="Mit Apple Watch: Öffne auf dem iPhone die App „Watch“, scrolle zu „Verfügbare Apps“ und tippe bei ClimbRhythm auf „Installieren“. Bestätige danach die Installation auf der Watch; ohne diese Bestätigung dreht sich das Ladesymbol endlos." data-en="With an Apple Watch: open the “Watch” app on your iPhone, scroll to “Available Apps” and tap “Install” next to ClimbRhythm. Then confirm the installation on the Watch; without that confirmation the loading symbol keeps spinning." data-fr="Avec une Apple Watch : ouvre l’app « Watch » sur l’iPhone, fais défiler jusqu’à « Apps disponibles » et touche « Installer » à côté de ClimbRhythm. Confirme ensuite l’installation sur la Watch ; sans cette confirmation, le symbole de chargement tourne sans fin." data-es="Con Apple Watch: abre la app «Watch» en el iPhone, baja hasta «Apps disponibles» y toca «Instalar» junto a ClimbRhythm. Después confirma la instalación en el Watch; sin esa confirmación, el símbolo de carga gira sin parar." data-it="Con Apple Watch: apri l’app «Watch» sull’iPhone, scorri fino a «App disponibili» e tocca «Installa» accanto a ClimbRhythm. Poi conferma l’installazione sul Watch; senza questa conferma il simbolo di caricamento gira all’infinito."></div></li>
  </ol>
  <p class="note" data-de="Updates kommen über TestFlight; du bekommst eine Mitteilung, sobald ein neuer Build da ist. In der TestFlight-App ist bei ClimbRhythm „Automatische Updates“ normalerweise eingeschaltet, dann installiert sich der neue Build von selbst. Ist der Schalter aus, öffnest du TestFlight und tippst bei ClimbRhythm auf „Aktualisieren“. Dort steht auch, was sich geändert hat. Deine Trainings bleiben bei jedem Update erhalten." data-en="Updates arrive through TestFlight; you get a notification as soon as a new build is available. In the TestFlight app, “Automatic Updates” is normally switched on for ClimbRhythm, so the new build installs by itself. If the switch is off, open TestFlight and tap “Update” next to ClimbRhythm. It also shows what has changed. Your workouts stay in place with every update." data-fr="Les mises à jour arrivent par TestFlight ; tu reçois une notification dès qu’une nouvelle version est disponible. Dans l’app TestFlight, « Mises à jour automatiques » est normalement activé pour ClimbRhythm, la nouvelle version s’installe alors toute seule. Si l’option est désactivée, ouvre TestFlight et touche « Mettre à jour » à côté de ClimbRhythm. Tu y vois aussi ce qui a changé. Tes entraînements sont conservés à chaque mise à jour." data-es="Las actualizaciones llegan por TestFlight; recibes una notificación en cuanto hay una versión nueva. En la app TestFlight, «Actualizaciones automáticas» suele estar activado para ClimbRhythm, y entonces la versión nueva se instala sola. Si está desactivado, abre TestFlight y toca «Actualizar» junto a ClimbRhythm. Allí ves también qué ha cambiado. Tus entrenamientos se conservan en cada actualización." data-it="Gli aggiornamenti arrivano tramite TestFlight; ricevi una notifica appena c’è una nuova versione. Nell’app TestFlight, «Aggiornamenti automatici» di solito è attivo per ClimbRhythm, e la nuova versione si installa da sola. Se è disattivato, apri TestFlight e tocca «Aggiorna» accanto a ClimbRhythm. Lì vedi anche che cosa è cambiato. I tuoi allenamenti restano a ogni aggiornamento."></p>
</section>

<section>
  <h2 data-de="Neu in Build 2026112401 (24.11.2026)" data-en="New in build 2026112401 (24 Nov 2026)" data-fr="Nouveautés de la version 2026112401 (24/11/2026)" data-es="Novedades de la versión 2026112401 (24/11/2026)" data-it="Novità della versione 2026112401 (24/11/2026)"></h2>
  <ul class="news">
    <li data-de="Puls ohne Apple Watch: Brustgurte und Uhren von Garmin, Polar oder Coros lassen sich als Pulssensor verbinden. Anleitung weiter unten." data-en="Heart rate without an Apple Watch: chest straps and watches from Garmin, Polar or Coros can be connected as a heart rate sensor. Instructions below." data-fr="Le pouls sans Apple Watch : les ceintures cardio et les montres Garmin, Polar ou Coros se connectent comme capteur de pouls. Mode d’emploi plus bas." data-es="Pulso sin Apple Watch: las bandas pectorales y los relojes de Garmin, Polar o Coros se conectan como sensor de pulso. Instrucciones más abajo." data-it="Frequenza cardiaca senza Apple Watch: fasce toraciche e orologi Garmin, Polar o Coros si collegano come sensore. Istruzioni più sotto."></li>
    <li data-de="iCloud gleicht jetzt auch GPS-Strecken, Kilometerzeiten und gespeicherte Einheiten ab. Puls und Kalorien bleiben auf dem Gerät. Aktualisiere alle deine Geräte: Ein Gerät mit älterem Build gleicht erst nach dem Update wieder ab." data-en="iCloud now also syncs GPS routes, kilometre times and saved workouts. Heart rate and calories stay on the device. Update all your devices: a device on an older build only syncs again after the update." data-fr="iCloud synchronise maintenant aussi les parcours GPS, les temps au kilomètre et les séances enregistrées. Le pouls et les calories restent sur l’appareil. Mets à jour tous tes appareils : un appareil avec une ancienne version ne synchronise à nouveau qu’après la mise à jour." data-es="iCloud sincroniza ahora también las rutas GPS, los tiempos por kilómetro y las sesiones guardadas. El pulso y las calorías se quedan en el dispositivo. Actualiza todos tus dispositivos: uno con una versión anterior solo vuelve a sincronizar tras actualizar." data-it="iCloud ora sincronizza anche i percorsi GPS, i tempi al chilometro e le sessioni salvate. Frequenza cardiaca e calorie restano sul dispositivo. Aggiorna tutti i tuoi dispositivi: uno con una versione precedente torna a sincronizzare solo dopo l’aggiornamento."></li>
    <li data-de="In den iCloud-Einstellungen der App kannst du deine Daten in iCloud löschen. Die Trainings auf dem iPhone bleiben dabei erhalten." data-en="In the app’s iCloud settings you can delete your data in iCloud. The workouts on your iPhone stay as they are." data-fr="Dans les réglages iCloud de l’app, tu peux supprimer tes données dans iCloud. Les entraînements sur l’iPhone restent intacts." data-es="En los ajustes de iCloud de la app puedes borrar tus datos de iCloud. Los entrenamientos del iPhone se conservan." data-it="Nelle impostazioni iCloud dell’app puoi eliminare i tuoi dati da iCloud. Gli allenamenti sull’iPhone restano invariati."></li>
  </ul>
</section>

<section>
  <h2 data-de="Neu in Build 2026112301 (23.11.2026)" data-en="New in build 2026112301 (23 Nov 2026)" data-fr="Nouveautés de la version 2026112301 (23/11/2026)" data-es="Novedades de la versión 2026112301 (23/11/2026)" data-it="Novità della versione 2026112301 (23/11/2026)"></h2>
  <ul class="news">
    <li data-de="Gewichte tippst du als Zahl ein, mit Knöpfen für kleine und große Schritte. Die Schieberegler sind weg." data-en="Type weights as a number, with buttons for small and large steps. The sliders are gone." data-fr="Tu saisis les charges en chiffres, avec des boutons pour les petits et les grands pas. Les curseurs ont disparu." data-es="Los pesos se escriben como número, con botones para pasos pequeños y grandes. Los deslizadores ya no están." data-it="I pesi si scrivono come numero, con pulsanti per passi piccoli e grandi. I cursori non ci sono più."></li>
    <li data-de="Nach einem Kraftsatz kannst du die geschafften Wiederholungen korrigieren – am iPhone und an der Watch." data-en="After a strength set you can correct the reps you actually did – on iPhone and Watch." data-fr="Après une série de musculation, tu peux corriger les répétitions réellement faites – sur l’iPhone et sur la Watch." data-es="Después de una serie de fuerza puedes corregir las repeticiones hechas, en el iPhone y en el Watch." data-it="Dopo una serie di forza puoi correggere le ripetizioni fatte – su iPhone e Watch."></li>
    <li data-de="Laufen, Rad, Wandern: Die Watch zeigt die Distanz, iPhone und Watch die Zeit des letzten Kilometers." data-en="Running, cycling, hiking: the Watch shows the distance, iPhone and Watch the time of your last kilometre." data-fr="Course, vélo, randonnée : la Watch affiche la distance, l’iPhone et la Watch le temps du dernier kilomètre." data-es="Correr, ciclismo, senderismo: el Watch muestra la distancia; el iPhone y el Watch, el tiempo del último kilómetro." data-it="Corsa, ciclismo, escursionismo: il Watch mostra la distanza, iPhone e Watch il tempo dell’ultimo chilometro."></li>
    <li data-de="Die Watch-App öffnet sich von selbst, wenn du am iPhone eine Session startest." data-en="The Watch app opens by itself when you start a session on the iPhone." data-fr="L’app de la Watch s’ouvre toute seule quand tu démarres une séance sur l’iPhone." data-es="La app del Watch se abre sola cuando inicias una sesión en el iPhone." data-it="L’app del Watch si apre da sola quando avvii una sessione sull’iPhone."></li>
    <li data-de="Eine Session an der Watch beenden geht jetzt auch, wenn das iPhone nicht erreichbar ist." data-en="You can now end a session on the Watch even when the iPhone is out of reach." data-fr="Tu peux maintenant terminer une séance sur la Watch même si l’iPhone est hors de portée." data-es="Ahora puedes terminar una sesión en el Watch aunque el iPhone no esté al alcance." data-it="Ora puoi terminare una sessione sul Watch anche se l’iPhone non è raggiungibile."></li>
    <li data-de="Einstellungen → Sicherung &amp; Zurücksetzen → „Frühere Stände“: automatische Kopien deiner Daten wiederherstellen." data-en="Settings → Backup &amp; reset → “Earlier versions”: restore automatic copies of your data." data-fr="Réglages → Sauvegarde et réinitialisation → « Versions précédentes » : restaurer les copies automatiques de tes données." data-es="Ajustes → Copia de seguridad y restablecer → «Versiones anteriores»: restaurar copias automáticas de tus datos." data-it="Impostazioni → Backup e ripristino → «Versioni precedenti»: ripristinare le copie automatiche dei tuoi dati."></li>
  </ul>
</section>

<section>
  <h2 data-de="Eine Session aufzeichnen" data-en="Record a session" data-fr="Enregistrer une séance" data-es="Grabar una sesión" data-it="Registrare una sessione"></h2>
  <p data-de="Wähle auf der Startseite deine Sportart und tippe auf „Session starten“. Die Session läuft dann über dein ganzes Training durch. Währenddessen trägst du beliebig viele Routen, Boulder, Sätze oder Timer-Runden ein. So zeichnest du die Gesamtzeit der Session auf und zusätzlich die Belastungszeiten: wie lange du tatsächlich an der Wand, am Board oder im Satz warst. Mit Apple Watch kommt dein Puls dazu. Am Ende beendest du die Session und kannst festhalten, wie sie sich angefühlt hat, mit einem kurzen Kommentar." data-en="Pick your sport on the start screen and tap “Start session”. The session then runs through your whole training. Along the way you record as many routes, boulders, sets or timer rounds as you like. That gives you the total time of the session and, in addition, your effort times: how long you were actually on the wall, on the board or in a set. With an Apple Watch your heart rate is added. When you finish, you can note how the session felt and add a short comment." data-fr="Choisis ton sport sur l’écran d’accueil et touche « Démarrer une séance ». La séance court alors sur tout ton entraînement. Pendant ce temps, tu notes autant de voies, de blocs, de séries ou de tours de minuteur que tu veux. Tu enregistres ainsi la durée totale de la séance et, en plus, les temps d’effort : combien de temps tu as réellement passé sur le mur, sur la poutre ou dans une série. Avec une Apple Watch, ta fréquence cardiaque s’y ajoute. À la fin, tu termines la séance et tu peux noter ton ressenti, avec un court commentaire." data-es="Elige tu deporte en la pantalla de inicio y toca «Iniciar sesión». La sesión corre entonces durante todo tu entrenamiento. Mientras tanto anotas tantas vías, búlderes, series o rondas de temporizador como quieras. Así grabas el tiempo total de la sesión y, además, los tiempos de esfuerzo: cuánto has estado realmente en la pared, en la tabla o en una serie. Con Apple Watch se añade tu pulso. Al final terminas la sesión y puedes anotar cómo te has sentido, con un comentario breve." data-it="Scegli il tuo sport nella schermata iniziale e tocca «Avvia sessione». La sessione prosegue poi per tutto il tuo allenamento. Nel frattempo registri quante vie, blocchi, serie o giri del timer vuoi. Così registri il tempo totale della sessione e, in più, i tempi di sforzo: quanto sei stato davvero in parete, sulla trave o in una serie. Con Apple Watch si aggiunge il battito. Alla fine termini la sessione e puoi annotare come ti sei sentito, con un breve commento."></p>
  <div class="shots">
    <figure><img data-shot="sports" width="480" height="1044" alt="" loading="lazy"><figcaption data-de="Sportart wählen" data-en="Pick your sport" data-fr="Choisir un sport" data-es="Elegir deporte" data-it="Scegli sport"></figcaption></figure>
    <figure><img data-shot="bouldering" width="480" height="1044" alt="" loading="lazy"><figcaption data-de="Einen Boulder bewerten" data-en="Rate a boulder" data-fr="Évaluer un bloc" data-es="Valorar un búlder" data-it="Valutare un boulder"></figcaption></figure>
    <figure><img data-shot="hangboard" width="480" height="1044" alt="" loading="lazy"><figcaption data-de="Hangboard-Timer mit „Weiter“" data-en="Hangboard timer with “Next”" data-fr="Minuteur de poutre avec « Suivant »" data-es="Temporizador de tabla con «Siguiente»" data-it="Timer per la trave con «Avanti»"></figcaption></figure>
    <figure><img data-shot="weights" width="480" height="1044" alt="" loading="lazy"><figcaption data-de="Gewicht als Zahl eingeben" data-en="Type the weight as a number" data-fr="Saisir la charge en chiffres" data-es="Escribir el peso como número" data-it="Scrivere il peso come numero"></figcaption></figure>
  </div>
  <dl>
    <dt data-de="Bouldern, Klettern" data-en="Bouldering, climbing" data-fr="Bloc, escalade" data-es="Búlder, escalada" data-it="Boulder, arrampicata"></dt>
    <dd data-de="Starte und beende jeden Versuch, danach bewertest du ihn kurz: Grad und Ergebnis (Versuch, Begehung, Flash), auf Wunsch Wandneigung, Länge in Metern oder Zügen, Gefühl und Notiz. Welche Angaben gefragt werden, legst du in den Einstellungen fest." data-en="Start and stop each attempt, then rate it briefly: grade and result (attempt, send, flash), optionally wall angle, length in metres or moves, feeling and a note. You choose in Settings which details are asked." data-fr="Démarre et termine chaque essai, puis évalue-le brièvement : cotation et résultat (essai, réussite, flash), et si tu veux inclinaison, longueur en mètres ou en mouvements, ressenti et note. Tu choisis dans les réglages ce qui est demandé." data-es="Inicia y termina cada intento y luego valóralo brevemente: grado y resultado (intento, encadene, flash) y, si quieres, inclinación, longitud en metros o en movimientos, sensación y nota. En Ajustes eliges qué datos se piden." data-it="Avvia e termina ogni tentativo, poi valutalo brevemente: grado e risultato (tentativo, riuscita, flash) e, se vuoi, inclinazione, lunghezza in metri o in movimenti, sensazione e nota. Nelle impostazioni scegli quali dati vengono chiesti."></dd>
    <dt data-de="Kraft" data-en="Strength" data-fr="Musculation" data-es="Fuerza" data-it="Forza"></dt>
    <dd data-de="Übungen mit Sätzen, Wiederholungen und Gewicht. Du kannst Übungen in einer eigenen Sammlung speichern und in Trainings wiederverwenden. Das Gewicht tippst du als Zahl ein oder änderst es mit den Knöpfen darunter. Nach einem Satz kannst du die tatsächlich geschafften Wiederholungen korrigieren, am iPhone und an der Watch." data-en="Exercises with sets, reps and weight. You can save exercises in your own library and reuse them in workouts. Type the weight as a number or change it with the buttons below. After a set you can correct the reps you actually did, on the iPhone and on the Watch." data-fr="Exercices avec séries, répétitions et charge. Tu peux enregistrer des exercices dans ta propre collection et les réutiliser dans tes entraînements. Tu saisis la charge en chiffres ou tu la modifies avec les boutons en dessous. Après une série, tu peux corriger les répétitions réellement faites, sur l’iPhone et sur la Watch." data-es="Ejercicios con series, repeticiones y peso. Puedes guardar ejercicios en tu propia colección y reutilizarlos en tus entrenamientos. El peso lo escribes como número o lo cambias con los botones de debajo. Después de una serie puedes corregir las repeticiones que has hecho de verdad, en el iPhone y en el Watch." data-it="Esercizi con serie, ripetizioni e peso. Puoi salvare gli esercizi in una tua raccolta e riutilizzarli negli allenamenti. Il peso lo scrivi come numero o lo cambi con i pulsanti sotto. Dopo una serie puoi correggere le ripetizioni fatte davvero, sull’iPhone e sul Watch."></dd>
    <dt data-de="Hangboard" data-en="Hangboard" data-fr="Poutre" data-es="Tabla multipresa" data-it="Trave"></dt>
    <dd data-de="Übungen mit Intervall-Timer: Belastung, Pause, Runden. Einhändig geht es getrennt je Hand oder abwechselnd links und rechts in einem Timer. Mit „Weiter“ überspringst du eine Phase." data-en="Exercises with an interval timer: work, rest, rounds. One-handed work runs per hand or alternating left and right in one timer. “Next” skips a phase." data-fr="Exercices avec minuteur d’intervalles : effort, repos, tours. À une main, c’est séparé par main ou en alternance gauche et droite dans un seul minuteur. « Suivant » saute une phase." data-es="Ejercicios con temporizador de intervalos: esfuerzo, descanso, rondas. A una mano se hace por separado con cada mano o alternando izquierda y derecha en un solo temporizador. «Siguiente» salta una fase." data-it="Esercizi con timer a intervalli: sforzo, riposo, giri. A una mano si lavora separatamente per mano oppure alternando sinistra e destra in un unico timer. «Avanti» salta una fase."></dd>
    <dt data-de="Einheiten" data-en="Workouts" data-fr="Séances types" data-es="Sesiones tipo" data-it="Sessioni tipo"></dt>
    <dd data-de="Trainierst du immer wieder dieselben Übungen, speicherst du sie mit „Als Einheit speichern“ unter einem Namen, zum Beispiel „Kraft Oberkörper“. Beim nächsten Start wählst du die Einheit aus. Wiederholungen und Gewichte stehen dann so, wie du sie beim letzten Mal gemacht hast. Das geht für Kraft, Hangboard und jede andere Sportart mit Übungen." data-en="If you train the same exercises again and again, save them under a name with “Save as workout”, for example “Upper body”. The next time you start, you pick the workout. Reps and weights are then set the way you did them last time. This works for strength, hangboard and any other sport with exercises." data-fr="Si tu fais régulièrement les mêmes exercices, enregistre-les sous un nom avec « Enregistrer comme séance », par exemple « Haut du corps ». Au prochain démarrage, tu choisis la séance. Les répétitions et les charges sont alors celles de ta dernière fois. Cela vaut pour la musculation, la poutre et tout autre sport avec des exercices." data-es="Si entrenas siempre los mismos ejercicios, guárdalos con un nombre mediante «Guardar como sesión», por ejemplo «Tren superior». La próxima vez que empieces, eliges la sesión. Las repeticiones y los pesos aparecen como los hiciste la última vez. Sirve para fuerza, tabla multipresa y cualquier otro deporte con ejercicios." data-it="Se alleni sempre gli stessi esercizi, salvali con un nome tramite «Salva come sessione», per esempio «Parte alta». Al prossimo avvio scegli la sessione. Ripetizioni e pesi sono quelli che hai fatto l’ultima volta. Vale per forza, trave e ogni altro sport con esercizi."></dd>
    <dt data-de="Laufen, Rad, Wandern" data-en="Running, cycling, hiking" data-fr="Course, vélo, randonnée" data-es="Correr, ciclismo, senderismo" data-it="Corsa, ciclismo, escursionismo"></dt>
    <dd data-de="Draußen zeichnet das iPhone auf Wunsch die Strecke per GPS auf, auch bei gesperrtem Bildschirm. Pausieren oder Beenden stoppt die Aufzeichnung. iPhone und Watch zeigen die Distanz und die Zeit des letzten Kilometers." data-en="Outdoors the iPhone can record your route with GPS, also while the screen is locked. Pausing or finishing stops the recording. iPhone and Watch show the distance and the time of your last kilometre." data-fr="En extérieur, l’iPhone peut enregistrer le parcours par GPS, même écran verrouillé. Mettre en pause ou terminer arrête l’enregistrement. L’iPhone et la Watch affichent la distance et le temps du dernier kilomètre." data-es="Al aire libre, el iPhone puede grabar el recorrido por GPS, también con la pantalla bloqueada. Pausar o terminar detiene la grabación. El iPhone y el Watch muestran la distancia y el tiempo del último kilómetro." data-it="All’aperto l’iPhone può registrare il percorso con il GPS, anche a schermo bloccato. Mettere in pausa o terminare ferma la registrazione. iPhone e Watch mostrano la distanza e il tempo dell’ultimo chilometro."></dd>
    <dt data-de="Schwimmen" data-en="Swimming" data-fr="Natation" data-es="Natación" data-it="Nuoto"></dt>
    <dd data-de="Für das Becken wählst du 25 m oder 50 m. Die Apple Watch zählt die Bahnen; öffne ClimbRhythm auf der Watch, bevor du ins Wasser gehst. Ohne Watch trägst du die Bahnen danach ein." data-en="For the pool you choose 25 m or 50 m. The Apple Watch counts your lengths; open ClimbRhythm on the Watch before you get in the water. Without a Watch you enter the lengths afterwards." data-fr="Pour le bassin, tu choisis 25 m ou 50 m. L’Apple Watch compte les longueurs ; ouvre ClimbRhythm sur la Watch avant d’entrer dans l’eau. Sans Watch, tu saisis les longueurs après." data-es="Para la piscina eliges 25 m o 50 m. El Apple Watch cuenta los largos; abre ClimbRhythm en el Watch antes de entrar al agua. Sin Watch, introduces los largos después." data-it="Per la vasca scegli 25 m o 50 m. Apple Watch conta le vasche; apri ClimbRhythm sul Watch prima di entrare in acqua. Senza Watch inserisci le vasche dopo."></dd>
  </dl>
</section>

<section>
  <h2 data-de="Apple Watch" data-en="Apple Watch" data-fr="Apple Watch" data-es="Apple Watch" data-it="Apple Watch"></h2>
  <p data-de="Die Watch zeigt die laufende Session und steuert sie: Versuch starten und beenden, bewerten, Satz oder Timer starten, pausieren. Sie misst den Puls und gibt die Timer-Signale am Handgelenk. Die Session selbst startest du am iPhone; das iPhone sollte in Reichweite sein. Die Watch-App öffnet sich beim Start von selbst. Ist das iPhone einmal nicht erreichbar, kannst du die Session an der Watch trotzdem beenden; das iPhone übernimmt das, sobald die Verbindung wieder steht." data-en="The Watch shows the running session and controls it: start and stop an attempt, rate it, start a set or timer, pause. It measures your heart rate and gives the timer signals on your wrist. You start the session on the iPhone; keep the iPhone within reach. The Watch app opens by itself when you start. If the iPhone is out of reach, you can still end the session on the Watch; the iPhone takes it over as soon as the connection is back." data-fr="La Watch affiche la séance en cours et la pilote : démarrer et terminer un essai, l’évaluer, lancer une série ou un minuteur, mettre en pause. Elle mesure la fréquence cardiaque et donne les signaux du minuteur au poignet. La séance elle-même se démarre sur l’iPhone ; garde l’iPhone à portée. L’app de la Watch s’ouvre toute seule au démarrage. Si l’iPhone est hors de portée, tu peux quand même terminer la séance sur la Watch ; l’iPhone la reprend dès que la connexion est rétablie." data-es="El Watch muestra la sesión en curso y la controla: iniciar y terminar un intento, valorarlo, iniciar una serie o un temporizador, pausar. Mide el pulso y da las señales del temporizador en la muñeca. La sesión se inicia en el iPhone; mantén el iPhone cerca. La app del Watch se abre sola al empezar. Si el iPhone no está al alcance, puedes terminar la sesión igualmente en el Watch; el iPhone la recoge en cuanto vuelve la conexión." data-it="Il Watch mostra la sessione in corso e la controlla: avviare e terminare un tentativo, valutarlo, avviare una serie o un timer, mettere in pausa. Misura il battito e dà i segnali del timer al polso. La sessione si avvia sull’iPhone; tieni l’iPhone a portata. L’app del Watch si apre da sola all’avvio. Se l’iPhone non è raggiungibile, puoi comunque terminare la sessione sul Watch; l’iPhone la riprende appena torna la connessione."></p>
  <p data-de="Mit der Watch zählt die App auch die Kalorien deiner Session. Unter Einstellungen → Apple Watch kannst du „Mit der Watch messen“ ausschalten; dann misst sie weder Puls noch Kalorien und schont ihren Akku, zum Beispiel an einem langen Tag am Fels." data-en="With the Watch the app also counts the calories of your session. Under Settings → Apple Watch you can switch off “Measure with the Watch”; it then measures neither heart rate nor calories and saves its battery, for example on a long day at the crag." data-fr="Avec la Watch, l’app compte aussi les calories de ta séance. Dans Réglages → Apple Watch, tu peux désactiver « Mesurer avec la Watch » ; elle ne mesure alors ni fréquence cardiaque ni calories et économise sa batterie, par exemple lors d’une longue journée en falaise." data-es="Con el Watch la app cuenta también las calorías de tu sesión. En Ajustes → Apple Watch puedes desactivar «Medir con el Watch»; entonces no mide ni pulso ni calorías y ahorra batería, por ejemplo en un día largo en la roca." data-it="Con il Watch l’app conta anche le calorie della sessione. In Impostazioni → Apple Watch puoi disattivare «Misura con il Watch»; in quel caso non misura né battito né calorie e risparmia batteria, per esempio in una lunga giornata in falesia."></p>
  <div class="shots one">
    <figure class="watch"><img data-shot="watch" width="416" height="496" alt="" loading="lazy"><figcaption data-de="Laufende Boulder-Session auf der Watch" data-en="Running bouldering session on the Watch" data-fr="Séance de bloc en cours sur la Watch" data-es="Sesión de búlder en curso en el Watch" data-it="Sessione di boulder in corso sul Watch"></figcaption></figure>
  </div>
</section>

<section>
  <h2 data-de="Pulsgurt oder andere Uhr" data-en="Chest strap or another watch" data-fr="Ceinture cardio ou autre montre" data-es="Banda pectoral u otro reloj" data-it="Fascia toracica o altro orologio"></h2>
  <p data-de="Ohne Apple Watch misst du den Puls mit einem Brustgurt oder einer Uhr, die ihre Herzfrequenz per Bluetooth sendet – zum Beispiel von Garmin, Polar oder Coros. Der Sensor liefert nur den Puls: Versuche, Timer und das Ende der Session bedienst du am iPhone, und das iPhone muss in Reichweite bleiben." data-en="Without an Apple Watch you measure your heart rate with a chest strap or a watch that broadcasts its heart rate over Bluetooth – for example from Garmin, Polar or Coros. The sensor only delivers the heart rate: attempts, timers and ending the session are done on the iPhone, and the iPhone has to stay within Bluetooth range." data-fr="Sans Apple Watch, tu mesures ton pouls avec une ceinture cardio ou une montre qui diffuse sa fréquence cardiaque en Bluetooth – par exemple de Garmin, Polar ou Coros. Le capteur ne fournit que le pouls : les essais, les minuteurs et la fin de la séance se gèrent sur l’iPhone, qui doit rester à portée Bluetooth." data-es="Sin Apple Watch mides el pulso con una banda pectoral o un reloj que transmite su frecuencia cardiaca por Bluetooth, por ejemplo de Garmin, Polar o Coros. El sensor solo aporta el pulso: los intentos, los temporizadores y el final de la sesión se manejan en el iPhone, que debe permanecer dentro del alcance de Bluetooth." data-it="Senza Apple Watch misuri la frequenza cardiaca con una fascia toracica o un orologio che la trasmette via Bluetooth, ad esempio di Garmin, Polar o Coros. Il sensore fornisce solo la frequenza: tentativi, timer e fine della sessione si gestiscono sull’iPhone, che deve restare nel raggio del Bluetooth."></p>
  <ol class="steps">
    <li><div data-de="Polar-Gurt (H9, H10): Elektroden anfeuchten und anlegen. Er sendet von selbst, sobald du ihn trägst." data-en="Polar strap (H9, H10): moisten the electrodes and put it on. It broadcasts by itself as soon as you wear it." data-fr="Ceinture Polar (H9, H10) : humidifie les électrodes et mets-la. Elle émet toute seule dès que tu la portes." data-es="Banda Polar (H9, H10): humedece los electrodos y póntela. Transmite sola en cuanto la llevas puesta." data-it="Fascia Polar (H9, H10): inumidisci gli elettrodi e indossala. Trasmette da sola appena la indossi."></div></li>
    <li><div data-de="Garmin-Uhr: „Herzfrequenz senden“ einschalten. Je nach Modell: MENU gedrückt halten → Sensoren und Zubehör → HF am Handgelenk → Herzfrequenz senden, oder UP gedrückt halten → Fitness → HF am Handgelenk → Herzfrequenz senden. Polar-Uhr: „Herzfrequenz mit anderen Geräten teilen“. Coros-Uhr: „Broadcast HR“ in der Toolbox." data-en="Garmin watch: switch on “Broadcast Heart Rate”. Depending on the model: hold MENU → Sensors &amp; Accessories → Wrist Heart Rate → Broadcast Heart Rate, or hold UP → Health &amp; Wellness → Wrist Heart Rate → Broadcast Heart Rate. Polar watch: “Share HR with other devices”. Coros watch: “Broadcast HR” in the toolbox." data-fr="Montre Garmin : active « Diffusion de la fréquence cardiaque ». Maintiens UP enfoncé → Santé et bien-être → FC au poignet → Diffusion de la fréquence cardiaque ; sur d’autres modèles, maintiens MENU enfoncé et cherche le même réglage sous les capteurs. Montre Polar : partage de la fréquence cardiaque avec d’autres appareils. Montre Coros : « Broadcast HR » dans la boîte à outils." data-es="Reloj Garmin: activa «Emitir frecuencia cardiaca». Mantén pulsado UP → Salud y bienestar → FC en la muñeca → Emitir frecuencia cardiaca; en otros modelos, mantén pulsado MENU y busca el mismo ajuste en los sensores. Reloj Polar: compartir la frecuencia cardiaca con otros dispositivos. Reloj Coros: «Broadcast HR» en la caja de herramientas." data-it="Orologio Garmin: attiva «Trasmetti FC». Tieni premuto UP → Salute &amp; Benessere → Cardio da polso → Trasmetti FC; su altri modelli tieni premuto MENU e cerca la stessa impostazione tra i sensori. Orologio Polar: condivisione della frequenza cardiaca con altri dispositivi. Orologio Coros: «Broadcast HR» nella cassetta degli attrezzi."></div></li>
    <li><div data-de="In ClimbRhythm: Einstellungen → Pulssensor → „Pulssensor suchen“. Erlaube beim ersten Mal Bluetooth und tippe deinen Sensor in der Liste an." data-en="In ClimbRhythm: Settings → Heart rate sensor → “Find heart rate sensor”. Allow Bluetooth the first time and tap your sensor in the list." data-fr="Dans ClimbRhythm : Réglages → Capteur de pouls → « Chercher un capteur de pouls ». Autorise le Bluetooth la première fois et touche ton capteur dans la liste." data-es="En ClimbRhythm: Ajustes → Sensor de pulso → «Buscar sensor de pulso». Permite el Bluetooth la primera vez y toca tu sensor en la lista." data-it="In ClimbRhythm: Impostazioni → Sensore di frequenza cardiaca → «Cerca sensore di frequenza cardiaca». Consenti il Bluetooth la prima volta e tocca il tuo sensore nell’elenco."></div></li>
    <li><div data-de="Starte eine Session. ClimbRhythm verbindet sich von selbst; der Puls erscheint in der Session und danach im Pulsverlauf." data-en="Start a session. ClimbRhythm connects by itself; the heart rate appears in the session and afterwards in the heart rate chart." data-fr="Démarre une séance. ClimbRhythm se connecte tout seul ; le pouls s’affiche dans la séance puis dans la courbe du pouls." data-es="Inicia una sesión. ClimbRhythm se conecta solo; el pulso aparece en la sesión y después en el gráfico del pulso." data-it="Avvia una sessione. ClimbRhythm si collega da solo; la frequenza appare nella sessione e poi nel grafico della frequenza."></div></li>
  </ol>
  <p data-de="Der Sensor erscheint nicht in der Liste? Trenne ihn von anderen Apps: Viele Sensoren erlauben nur eine Bluetooth-Verbindung (beim Polar H10 lässt sich in Polar Beat oder Polar Flow eine zweite einschalten; eine Coros-Uhr muss vorher vom Telefon getrennt werden). Ältere Garmin-Uhren senden nur per ANT+, das kann das iPhone nicht empfangen. Misst zusätzlich eine Apple Watch, zählt ihr Puls. Diese Funktion ist neu und noch kaum erprobt – schreib uns über „Feedback senden“, welches Modell du nutzt und ob es geklappt hat." data-en="The sensor does not show up in the list? Disconnect it from other apps: many sensors allow only one Bluetooth connection (on the Polar H10 a second one can be switched on in Polar Beat or Polar Flow; a Coros watch has to be disconnected from the phone first). Older Garmin watches broadcast over ANT+ only, which the iPhone cannot receive. If an Apple Watch measures as well, its heart rate is used. This feature is new and has hardly been tried yet – use “Send feedback” to tell us which model you use and whether it worked." data-fr="Le capteur n’apparaît pas dans la liste ? Déconnecte-le des autres apps : beaucoup de capteurs n’acceptent qu’une seule connexion Bluetooth (sur le Polar H10, une seconde s’active dans Polar Beat ou Polar Flow ; une montre Coros doit d’abord être déconnectée du téléphone). Les anciennes montres Garmin n’émettent qu’en ANT+, que l’iPhone ne peut pas recevoir. Si une Apple Watch mesure aussi, c’est son pouls qui compte. Cette fonction est nouvelle et encore peu testée – utilise « Envoyer un retour » pour nous dire quel modèle tu utilises et si ça a marché." data-es="¿El sensor no aparece en la lista? Desconéctalo de otras apps: muchos sensores solo admiten una conexión Bluetooth (en el Polar H10 se puede activar una segunda en Polar Beat o Polar Flow; un reloj Coros debe desconectarse antes del teléfono). Los relojes Garmin antiguos solo transmiten por ANT+, que el iPhone no puede recibir. Si además mide un Apple Watch, se usa su pulso. Esta función es nueva y apenas se ha probado: cuéntanos con «Enviar comentarios» qué modelo usas y si funcionó." data-it="Il sensore non compare nell’elenco? Scollegalo dalle altre app: molti sensori accettano una sola connessione Bluetooth (sul Polar H10 se ne può attivare una seconda in Polar Beat o Polar Flow; un orologio Coros va prima scollegato dal telefono). I vecchi orologi Garmin trasmettono solo in ANT+, che l’iPhone non può ricevere. Se misura anche un Apple Watch, vale la sua frequenza. Questa funzione è nuova e ancora poco provata: scrivici con «Invia feedback» quale modello usi e se ha funzionato."></p>
</section>

<section>
  <h2 data-de="Zyklen" data-en="Cycles" data-fr="Cycles" data-es="Ciclos" data-it="Cicli"></h2>
  <p data-de="Ein Zyklus ist ein Zeitraum mit Zielen: wie oft du welche Sportart trainieren willst. Du findest die Zyklen über die Startseite; dort siehst du auch, was im laufenden Zyklus schon geschafft ist." data-en="A cycle is a period with goals: how often you want to train which sport. You reach your cycles from the start screen, which also shows what you have already done in the current cycle." data-fr="Un cycle est une période avec des objectifs : combien de fois tu veux pratiquer quel sport. Tu trouves les cycles depuis l’écran d’accueil ; tu y vois aussi ce qui est déjà fait dans le cycle en cours." data-es="Un ciclo es un periodo con objetivos: cuántas veces quieres entrenar cada deporte. Encuentras los ciclos desde la pantalla de inicio; allí ves también lo que ya has hecho en el ciclo actual." data-it="Un ciclo è un periodo con obiettivi: quante volte vuoi allenare ciascuno sport. Trovi i cicli dalla schermata iniziale; lì vedi anche che cosa hai già fatto nel ciclo in corso."></p>
  <div class="shots one">
    <figure><img data-shot="planning" width="480" height="1044" alt="" loading="lazy"><figcaption data-de="Zyklus mit Kalender, Zielen und Einheiten" data-en="Cycle with calendar, goals and workouts" data-fr="Cycle avec calendrier, objectifs et séances" data-es="Ciclo con calendario, objetivos y sesiones" data-it="Ciclo con calendario, obiettivi e sessioni"></figcaption></figure>
  </div>
  <dl>
    <dt data-de="Planen" data-en="Plan" data-fr="Planifier" data-es="Planificar" data-it="Pianificare"></dt>
    <dd data-de="Mit + legst du Beginn, Dauer und Ziele fest, zum Beispiel 2 Wochen mit 1 × Kraft, 3 × Klettern, 1 × Bouldern, 1 × Hangboard und 2 × Laufen. Zyklen überschneiden sich nicht; ein neuer kann direkt an den vorigen anschließen." data-en="With + you set start, length and goals, for example 2 weeks with 1 × strength, 3 × climbing, 1 × bouldering, 1 × hangboard and 2 × running. Cycles do not overlap; a new one can follow straight after the previous one." data-fr="Avec +, tu fixes le début, la durée et les objectifs, par exemple 2 semaines avec 1 × musculation, 3 × escalade, 1 × bloc, 1 × poutre et 2 × course à pied. Les cycles ne se chevauchent pas ; un nouveau peut suivre directement le précédent." data-es="Con + fijas inicio, duración y objetivos, por ejemplo 2 semanas con 1 × fuerza, 3 × escalada, 1 × búlder, 1 × tabla multipresa y 2 × correr. Los ciclos no se solapan; uno nuevo puede empezar justo después del anterior." data-it="Con + imposti inizio, durata e obiettivi, per esempio 2 settimane con 1 × forza, 3 × arrampicata, 1 × boulder, 1 × trave e 2 × corsa. I cicli non si sovrappongono; uno nuovo può seguire subito il precedente."></dd>
    <dt data-de="Einheiten" data-en="Workouts" data-fr="Séances" data-es="Sesiones" data-it="Sessioni"></dt>
    <dd data-de="Zu jedem Ziel kannst du Einheiten mit Übungen, Sätzen und Timern vorbereiten. Tippe auf eine Einheit, um sie direkt als Session zu starten; die Übungen sind dann sofort da." data-en="For each goal you can prepare workouts with exercises, sets and timers. Tap a workout to start it as a session right away; its exercises are ready at once." data-fr="Pour chaque objectif, tu peux préparer des séances avec exercices, séries et minuteurs. Touche une séance pour la démarrer directement ; ses exercices sont tout de suite là." data-es="Para cada objetivo puedes preparar sesiones con ejercicios, series y temporizadores. Toca una sesión para iniciarla directamente; sus ejercicios aparecen al momento." data-it="Per ogni obiettivo puoi preparare sessioni con esercizi, serie e timer. Tocca una sessione per avviarla subito; i suoi esercizi sono già pronti."></dd>
    <dt data-de="Kalender" data-en="Calendar" data-fr="Calendrier" data-es="Calendario" data-it="Calendario"></dt>
    <dd data-de="Grün sind die Tage eines Zyklus, dunkel ist heute. Tippe einen Tag an, um seinen Zyklus zu sehen; „Heute“ springt zurück." data-en="Green days belong to a cycle, the dark one is today. Tap a day to see its cycle; “Today” jumps back." data-fr="Les jours d’un cycle sont en vert, aujourd’hui est en foncé. Touche un jour pour voir son cycle ; « Aujourd’hui » y revient." data-es="Los días de un ciclo están en verde y hoy en oscuro. Toca un día para ver su ciclo; «Hoy» vuelve atrás." data-it="I giorni di un ciclo sono verdi, oggi è scuro. Tocca un giorno per vedere il suo ciclo; «Oggi» riporta indietro."></dd>
    <dt data-de="Pause" data-en="Pause" data-fr="Pause" data-es="Pausa" data-it="Pausa"></dt>
    <dd data-de="Bei Krankheit oder Urlaub trägst du eine Pause ein. Der Zyklus hält an und verlängert sich um die Pausentage, die folgenden Zyklen verschieben sich. Trainings an Pausentagen bleiben im Verlauf, zählen aber nicht zum Ziel." data-en="When you are ill or away, enter a pause. The cycle stops and is extended by the paused days, and the following cycles move back. Sessions on paused days stay in your history but do not count towards the goal." data-fr="En cas de maladie ou de vacances, tu saisis une pause. Le cycle s’arrête et se prolonge des jours de pause, les cycles suivants se décalent. Les entraînements des jours de pause restent dans l’historique, mais ne comptent pas pour l’objectif." data-es="Si estás enfermo o de vacaciones, introduces una pausa. El ciclo se detiene y se alarga con los días de pausa, y los ciclos siguientes se desplazan. Los entrenamientos en días de pausa siguen en el historial, pero no cuentan para el objetivo." data-it="In caso di malattia o vacanza inserisci una pausa. Il ciclo si ferma e si allunga dei giorni di pausa, i cicli successivi si spostano. Gli allenamenti nei giorni di pausa restano nella cronologia, ma non contano per l’obiettivo."></dd>
    <dt data-de="Erinnerungen" data-en="Reminders" data-fr="Rappels" data-es="Recordatorios" data-it="Promemoria"></dt>
    <dd data-de="Auf Wunsch erinnert dich die App an deine Ziele, zum Beispiel zur Zyklusmitte. Während einer Pause kommen keine Erinnerungen." data-en="If you like, the app reminds you of your goals, for example at the middle of a cycle. No reminders are sent during a pause." data-fr="Si tu le souhaites, l’app te rappelle tes objectifs, par exemple au milieu du cycle. Aucun rappel n’est envoyé pendant une pause." data-es="Si quieres, la app te recuerda tus objetivos, por ejemplo a mitad del ciclo. Durante una pausa no se envían recordatorios." data-it="Se vuoi, l’app ti ricorda i tuoi obiettivi, per esempio a metà ciclo. Durante una pausa non arrivano promemoria."></dd>
    <dt data-de="Teilen" data-en="Share" data-fr="Partager" data-es="Compartir" data-it="Condividere"></dt>
    <dd data-de="Aus einem Zyklus erstellst du eine Bildkarte mit deinem Fortschritt, zum Beispiel für Social Media oder zum Verschicken." data-en="From a cycle you create an image card showing your progress, for example for social media or to send to someone." data-fr="À partir d’un cycle, tu crées une carte image avec ta progression, par exemple pour les réseaux sociaux ou pour l’envoyer." data-es="A partir de un ciclo creas una tarjeta con tu progreso, por ejemplo para redes sociales o para enviarla." data-it="Da un ciclo crei una scheda immagine con i tuoi progressi, per esempio per i social o da inviare."></dd>
  </dl>
</section>

<section>
  <h2 data-de="Verlauf und Statistik" data-en="History and statistics" data-fr="Historique et statistiques" data-es="Historial y estadísticas" data-it="Cronologia e statistiche"></h2>
  <div class="shots two">
    <figure><img data-shot="history" width="480" height="1044" alt="" loading="lazy"><figcaption data-de="Verlauf" data-en="History" data-fr="Historique" data-es="Historial" data-it="Cronologia"></figcaption></figure>
    <figure><img data-shot="statistics" width="480" height="1044" alt="" loading="lazy"><figcaption data-de="Statistik mit Tageskurven" data-en="Statistics with daily curves" data-fr="Statistiques avec courbes par jour" data-es="Estadísticas con curvas diarias" data-it="Statistiche con curve giornaliere"></figcaption></figure>
  </div>
  <dl>
    <dt data-de="Verlauf" data-en="History" data-fr="Historique" data-es="Historial" data-it="Cronologia"></dt>
    <dd data-de="Alle Sessions mit Versuchen, Übungen und Pulskurve. Jede Session lässt sich nachträglich bearbeiten." data-en="All sessions with attempts, exercises and heart rate curve. Every session can be edited later." data-fr="Toutes les séances avec essais, exercices et courbe de fréquence cardiaque. Chaque séance peut être modifiée après coup." data-es="Todas las sesiones con intentos, ejercicios y curva de pulso. Cada sesión se puede editar después." data-it="Tutte le sessioni con tentativi, esercizi e curva del battito. Ogni sessione si può modificare in seguito."></dd>
    <dt data-de="Statistik" data-en="Statistics" data-fr="Statistiques" data-es="Estadísticas" data-it="Statistiche"></dt>
    <dd data-de="Kurven über Wochen und Monate, je Sportart; filterbar nach Zyklus, Monat oder eigenem Zeitraum. Du kannst schieben und mit zwei Fingern zoomen. Durch Halten und Ziehen liest du die Werte ab. Grade aus verschiedenen Skalen werden umgerechnet." data-en="Curves over weeks and months, per sport; filter by cycle, month or your own period. You can pan and pinch to zoom. Hold and drag to read the values. Grades from different scales are converted." data-fr="Courbes sur des semaines et des mois, par sport ; filtrables par cycle, mois ou période de ton choix. Tu peux faire défiler et zoomer avec deux doigts. En maintenant et en faisant glisser, tu lis les valeurs. Les cotations de différentes échelles sont converties." data-es="Curvas a lo largo de semanas y meses, por deporte; se pueden filtrar por ciclo, mes o un periodo propio. Puedes desplazar y hacer zoom con dos dedos. Manteniendo y arrastrando lees los valores. Los grados de distintas escalas se convierten." data-it="Curve su settimane e mesi, per sport; filtrabili per ciclo, mese o un periodo a scelta. Puoi scorrere e zoomare con due dita. Tenendo premuto e trascinando leggi i valori. I gradi di scale diverse vengono convertiti."></dd>
  </dl>
</section>

<section>
  <h2 data-de="Deine Daten" data-en="Your data" data-fr="Tes données" data-es="Tus datos" data-it="I tuoi dati"></h2>
  <p data-de="Deine Daten gehören dir. Sie liegen auf deinem Gerät und, wenn du es einschaltest, in deiner eigenen iCloud. Apple Health ist optional. Es gibt kein Konto bei ClimbRhythm und kein Tracking." data-en="Your data is yours. It stays on your device and, if you switch it on, in your own iCloud. Apple Health is optional. There is no ClimbRhythm account and no tracking." data-fr="Tes données t’appartiennent. Elles sont sur ton appareil et, si tu l’actives, dans ton propre iCloud. Apple Santé est facultatif. Il n’y a ni compte ClimbRhythm ni suivi." data-es="Tus datos son tuyos. Están en tu dispositivo y, si lo activas, en tu propio iCloud. Apple Salud es opcional. No hay cuenta de ClimbRhythm ni seguimiento." data-it="I tuoi dati sono tuoi. Stanno sul tuo dispositivo e, se lo attivi, nel tuo iCloud. Apple Salute è facoltativo. Non c’è un account ClimbRhythm né tracciamento."></p>
  <p data-de="Wichtig: Wenn du die App löschst, sind deine Trainings auf dem iPhone weg, auch die „Früheren Stände“. iOS warnt dich dabei nicht eigens. Speichere deshalb vorher eine Sicherung. Der iCloud-Abgleich bringt Trainings, Zyklen und Einheiten zurück, aber weder Puls noch Kalorien." data-en="Important: if you delete the app, your workouts on the iPhone are gone, including the “Earlier versions”. iOS does not warn you about this. So save a backup first. iCloud sync brings back workouts, cycles and saved workouts, but neither heart rate nor calories." data-fr="Important : si tu supprimes l’app, tes entraînements sur l’iPhone sont perdus, y compris les « Versions précédentes ». iOS ne t’en avertit pas spécialement. Enregistre donc une sauvegarde avant. La synchronisation iCloud ramène entraînements, cycles et séances enregistrées, mais ni le pouls ni les calories." data-es="Importante: si borras la app, tus entrenamientos del iPhone se pierden, también las «Versiones anteriores». iOS no te avisa de ello. Guarda antes una copia de seguridad. La sincronización con iCloud recupera entrenamientos, ciclos y sesiones guardadas, pero ni el pulso ni las calorías." data-it="Importante: se elimini l’app, i tuoi allenamenti sull’iPhone vanno persi, comprese le «Versioni precedenti». iOS non ti avvisa in modo specifico. Salva quindi prima un backup. La sincronizzazione iCloud riporta allenamenti, cicli e sessioni salvate, ma né la frequenza cardiaca né le calorie."></p>
  <p data-de="Neues iPhone? Wenn du es aus einem Backup oder per Direktübertragung einrichtest, kommen deine Trainings mit. Auf Nummer sicher gehst du so: Vor dem Wechsel in den Einstellungen unter „Sicherung &amp; Zurücksetzen“ auf „Sicherung speichern“ tippen, die Datei zum Beispiel in iCloud Drive ablegen und auf dem neuen Gerät mit „Sicherung wiederherstellen“ öffnen. Das Gleiche gilt, bevor du die App löschst. Außerdem legt die App täglich und vor jedem Update selbst eine Kopie an. Du findest sie am selben Ort unter „Frühere Stände“ und stellst sie mit einem Tipp wieder her." data-en="New iPhone? If you set it up from a backup or by direct transfer, your workouts come along. To be on the safe side: before switching, go to Settings, “Backup &amp; reset”, tap “Save backup”, put the file in iCloud Drive for example, and open it on the new device with “Restore backup”. The same applies before you delete the app. The app also makes a copy by itself every day and before each update. You find them in the same place under “Earlier versions” and restore one with a tap." data-fr="Nouvel iPhone ? Si tu le configures à partir d’une sauvegarde ou par transfert direct, tes entraînements suivent. Pour être tranquille : avant de changer, va dans Réglages, « Sauvegarde et réinitialisation », touche « Enregistrer une sauvegarde », place le fichier par exemple dans iCloud Drive et ouvre-le sur le nouvel appareil avec « Restaurer une sauvegarde ». Pareil avant de supprimer l’app. L’app crée aussi elle-même une copie chaque jour et avant chaque mise à jour. Tu les trouves au même endroit sous « Versions précédentes » et tu en restaures une d’un simple toucher." data-es="¿iPhone nuevo? Si lo configuras desde una copia de seguridad o por transferencia directa, tus entrenamientos vienen contigo. Para ir sobre seguro: antes del cambio, en Ajustes, «Copia de seguridad y restablecer», toca «Guardar copia de seguridad», guarda el archivo por ejemplo en iCloud Drive y ábrelo en el nuevo dispositivo con «Restaurar copia de seguridad». Lo mismo vale antes de borrar la app. Además, la app guarda por sí sola una copia cada día y antes de cada actualización. Las encuentras en el mismo sitio, en «Versiones anteriores», y restauras una con un toque." data-it="Nuovo iPhone? Se lo configuri da un backup o con il trasferimento diretto, i tuoi allenamenti ti seguono. Per andare sul sicuro: prima del cambio, in Impostazioni, «Backup e ripristino», tocca «Salva backup», metti il file per esempio in iCloud Drive e aprilo sul nuovo dispositivo con «Ripristina backup». Lo stesso vale prima di eliminare l’app. Inoltre l’app crea da sola una copia ogni giorno e prima di ogni aggiornamento. Le trovi nello stesso posto, in «Versioni precedenti», e ne ripristini una con un tocco."></p>
</section>

<section>
  <h2 data-de="Feedback" data-en="Feedback" data-fr="Retours" data-es="Comentarios" data-it="Feedback"></h2>
  <p data-de="Am schnellsten geht es über den Brief-Knopf auf der Startseite der App oder über „Feedback senden“ in den Einstellungen. Das öffnet eine Mail mit den technischen Angaben zu deinem Gerät; du siehst alles, bevor du sendest. Auch Kleinigkeiten helfen: Was war unklar, was hat genervt, was fehlt?" data-en="The quickest way is the envelope button on the app's start screen or “Send feedback” in Settings. It opens an email with the technical details of your device; you see everything before you send. Small things help too: what was unclear, what was annoying, what is missing?" data-fr="Le plus rapide est le bouton enveloppe sur l’écran d’accueil de l’app ou « Envoyer un retour » dans les réglages. Cela ouvre un e-mail avec les informations techniques de ton appareil ; tu vois tout avant d’envoyer. Les petits détails aident aussi : qu’est-ce qui n’était pas clair, qu’est-ce qui a gêné, qu’est-ce qui manque ?" data-es="Lo más rápido es el botón del sobre en la pantalla de inicio de la app o «Enviar comentarios» en Ajustes. Abre un correo con los datos técnicos de tu dispositivo; lo ves todo antes de enviar. Los detalles pequeños también ayudan: ¿qué no estaba claro, qué ha molestado, qué falta?" data-it="Il modo più rapido è il pulsante con la busta nella schermata iniziale dell’app oppure «Invia feedback» nelle impostazioni. Si apre un’e-mail con i dati tecnici del tuo dispositivo; vedi tutto prima di inviare. Anche i piccoli dettagli aiutano: che cosa non era chiaro, che cosa ha dato fastidio, che cosa manca?"></p>
  <p><span data-de="Oder direkt per Mail an " data-en="Or by email to " data-fr="Ou directement par e-mail à " data-es="O directamente por correo a " data-it="Oppure direttamente via e-mail a "></span><span class="addr">info@flow-design.app</span></p>
</section>

<footer data-de="ClimbRhythm ist in Entwicklung. Einzelne Funktionen können sich noch ändern, und es kann etwas haken." data-en="ClimbRhythm is in development. Individual features may still change, and things can be rough here and there." data-fr="ClimbRhythm est en développement. Certaines fonctions peuvent encore changer, et il peut y avoir des accrocs." data-es="ClimbRhythm está en desarrollo. Algunas funciones todavía pueden cambiar y puede haber fallos." data-it="ClimbRhythm è in sviluppo. Alcune funzioni possono ancora cambiare e qualcosa può incepparsi."></footer>
</div>
<script>
(function(){
  var langs=["de","en","fr","es","it"],lang="en";
  var pick=function(v){v=(v||"").slice(0,2).toLowerCase();return langs.indexOf(v)>=0?v:null};
  try{lang=pick(localStorage.getItem("lang"))||pick(navigator.language)||"en"}catch(e){lang=pick(navigator.language)||"en"}
  function show(l){
    lang=l;document.documentElement.lang=l;
    document.querySelectorAll("[data-de]").forEach(function(n){n.textContent=n.getAttribute("data-"+l)});
    document.querySelectorAll("img[data-shot]").forEach(function(n){n.src="img/"+n.getAttribute("data-shot")+"-"+l+".jpg";var c=n.parentNode.querySelector("figcaption");n.alt=c?c.textContent:""});
    document.querySelectorAll("[data-lang]").forEach(function(b){b.setAttribute("aria-pressed",b.getAttribute("data-lang")===l)});
    try{localStorage.setItem("lang",l)}catch(e){}
  }
  document.querySelectorAll("[data-lang]").forEach(function(b){b.addEventListener("click",function(){show(b.getAttribute("data-lang"))})});
  show(lang);
})();
</script>
</body>
