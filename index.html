<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ClimbRhythm Beta Guide</title>
<meta name="robots" content="noindex">
<style>
/* Layout: one reading column; install steps as the only numbered sequence, sports as a quiet two-column list. Colours follow the app's stone & sage. */
:root{--paper:#f1eee5;--surface:#e7e3d6;--ink:#293124;--muted:#5b6554;--green:#48603c;--line:#cfcabb;
  --display:"Avenir Next","Segoe UI",system-ui,sans-serif;--body:-apple-system,"Segoe UI",system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#1c211a;--surface:#262d23;--ink:#e9e8dc;--muted:#a7b09d;--green:#b5cf9a;--line:#3a4335;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#1c211a;--surface:#262d23;--ink:#e9e8dc;--muted:#a7b09d;--green:#b5cf9a;--line:#3a4335;color-scheme:dark}
*{box-sizing:border-box}
img{max-width:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
.page{max-width:44rem;margin:0 auto;padding-block:2rem 4rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:2.75rem}
header{display:flex;flex-direction:column;gap:1.25rem}
.top{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.75rem;font-family:var(--display);font-weight:600;font-size:1.1rem}
.brand img{width:44px;height:44px;border-radius:11px;display:block}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{font:500 .85rem var(--body);color:var(--muted);background:none;border:0;padding:.4rem .9rem;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--green);color:var(--paper)}
.lang button:focus-visible,a:focus-visible,.copy:focus-visible{outline:2px solid var(--green);outline-offset:2px}
h1{font-family:var(--display);font-weight:600;font-size:clamp(1.9rem,6vw,2.6rem);line-height:1.1;letter-spacing:-.02em;margin:0;text-wrap:balance}
.lead{font-size:1.1rem;color:var(--muted);margin:0;max-width:36rem}
section{display:flex;flex-direction:column;gap:1rem}
h2{font-family:var(--display);font-weight:600;font-size:1.3rem;margin:0;text-wrap:balance}
p{margin:0;max-width:38rem}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.75rem;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:2rem 1fr;gap:.75rem;align-items:start}
.steps li::before{content:counter(s);font:600 .95rem var(--display);width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;background:var(--green);color:var(--paper)}
.steps div{min-width:0}
.link{background:var(--surface);border-radius:12px;padding:.9rem 1rem;display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;justify-content:space-between}
.link a{color:var(--green);font-weight:600;overflow-wrap:anywhere;min-width:0}
.copy{font:500 .85rem var(--body);color:var(--ink);background:none;border:1px solid var(--line);border-radius:999px;padding:.35rem .9rem;cursor:pointer}
dl{margin:0;display:grid;grid-template-columns:minmax(8rem,11rem) 1fr;column-gap:1.25rem;row-gap:.9rem;border-top:1px solid var(--line);padding-top:1rem}
dt{font-weight:600}
dd{margin:0;min-width:0;color:var(--ink)}
@media (max-width:520px){dl{grid-template-columns:1fr;row-gap:.25rem}dd{padding-bottom:.75rem}}
.note{color:var(--muted);font-size:.95rem}
.shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1rem;max-width:38rem}
.shots.two{max-width:25rem}
.shots.one{max-width:12rem}
figure{margin:0;display:flex;flex-direction:column;gap:.5rem;min-width:0}
figure img{display:block;width:100%;height:auto;border-radius:18px;border:1px solid var(--line);background:var(--surface)}
.watch img{border-radius:22%;border:6px solid #1b1b1b}
figcaption{font-size:.85rem;color:var(--muted);line-height:1.35}
.addr{font-weight:600;user-select:all;overflow-wrap:anywhere}
footer{border-top:1px solid var(--line);padding-top:1rem;color:var(--muted);font-size:.9rem}
</style>
</head>

  <h1 data-de="So testest du ClimbRhythm" data-en="How to test ClimbRhythm"></h1>
  <p class="lead" data-de="Ein Trainingstagebuch für Klettern, Bouldern, Hangboard, Kraft und Ausdauer – auf iPhone und Apple Watch. Diese Seite erklärt die Installation und was die App kann." data-en="A training log for climbing, bouldering, hangboarding, strength and endurance – on iPhone and Apple Watch. This page explains how to install it and what the app can do."></p>
</header>

<section>
  <h2 data-de="Installieren" data-en="Install"></h2>
  <ol class="steps">
    <li><div data-de="Lade „TestFlight“ aus dem App Store. Die App ist von Apple und kostenlos." data-en="Get “TestFlight” from the App Store. It is made by Apple and free."></div></li>
    <li><div data-de="Öffne den Einladungslink, den du von Detlef bekommen hast, auf deinem iPhone und tippe auf „Installieren“." data-en="Open the invitation link you received from Detlef on your iPhone and tap “Install”."></div></li>
    <li><div data-de="Mit Apple Watch: Öffne auf dem iPhone die App „Watch“, scrolle zu „Verfügbare Apps“ und tippe bei ClimbRhythm auf „Installieren“. Bestätige danach die Installation auf der Watch; ohne diese Bestätigung dreht sich das Ladesymbol endlos." data-en="With an Apple Watch: open the “Watch” app on your iPhone, scroll to “Available Apps” and tap “Install” next to ClimbRhythm. Then confirm the installation on the Watch; without that confirmation the loading symbol keeps spinning."></div></li>
  </ol>
  <p class="note" data-de="Updates kommen über TestFlight. Dort siehst du bei jedem neuen Build, was sich geändert hat." data-en="Updates arrive through TestFlight. For every new build it shows what has changed."></p>
</section>

<section>
  <h2 data-de="Eine Session aufzeichnen" data-en="Record a session"></h2>
  <p data-de="Wähle auf der Startseite deine Sportart und tippe auf „Session starten“. Die Session läuft dann über dein ganzes Training durch. Währenddessen trägst du beliebig viele Routen, Boulder, Sätze oder Timer-Runden ein. So zeichnest du die Gesamtzeit der Session auf und zusätzlich die Belastungszeiten: wie lange du tatsächlich an der Wand, am Board oder im Satz warst. Mit Apple Watch kommt dein Puls dazu. Am Ende beendest du die Session und kannst festhalten, wie sie sich angefühlt hat, mit einem kurzen Kommentar." data-en="Pick your sport on the start screen and tap “Start session”. The session then runs through your whole training. Along the way you record as many routes, boulders, sets or timer rounds as you like. That gives you the total time of the session and, in addition, your effort times: how long you were actually on the wall, on the board or in a set. With an Apple Watch your heart rate is added. When you finish, you can note how the session felt and add a short comment."></p>
  <div class="shots">
    <figure><img data-shot="sports" width="480" height="1044" alt="" loading="lazy"><figcaption data-de="Sportart wählen" data-en="Pick your sport"></figcaption></figure>
    <figure><img data-shot="bouldering" width="480" height="1044" alt="" loading="lazy"><figcaption data-de="Einen Boulder bewerten" data-en="Rate a boulder"></figcaption></figure>
    <figure><img data-shot="hangboard" width="480" height="1044" alt="" loading="lazy"><figcaption data-de="Hangboard-Timer mit „Weiter“" data-en="Hangboard timer with “Next”"></figcaption></figure>
  </div>
  <dl>
    <dt data-de="Bouldern, Klettern" data-en="Bouldering, climbing"></dt>
    <dd data-de="Starte und beende jeden Versuch, danach bewertest du ihn kurz: Grad und Ergebnis (Versuch, Begehung, Flash), auf Wunsch Wandneigung, Länge in Metern oder Zügen, Gefühl und Notiz. Welche Angaben gefragt werden, legst du in den Einstellungen fest." data-en="Start and stop each attempt, then rate it briefly: grade and result (attempt, send, flash), optionally wall angle, length in metres or moves, feeling and a note. You choose in Settings which details are asked."></dd>
    <dt data-de="Kraft" data-en="Strength"></dt>
    <dd data-de="Übungen mit Sätzen, Wiederholungen und Gewicht. Du kannst Übungen in einer eigenen Sammlung speichern und in Trainings wiederverwenden." data-en="Exercises with sets, reps and weight. You can save exercises in your own library and reuse them in workouts."></dd>
    <dt data-de="Hangboard" data-en="Hangboard"></dt>
    <dd data-de="Übungen mit Intervall-Timer: Belastung, Pause, Runden. Einhändig geht es getrennt je Hand oder abwechselnd links und rechts in einem Timer. Mit „Weiter“ überspringst du eine Phase." data-en="Exercises with an interval timer: work, rest, rounds. One-handed work runs per hand or alternating left and right in one timer. “Next” skips a phase."></dd>
    <dt data-de="Laufen, Rad, Wandern" data-en="Running, cycling, hiking"></dt>
    <dd data-de="Draußen zeichnet das iPhone auf Wunsch die Strecke per GPS auf, auch bei gesperrtem Bildschirm. Pausieren oder Beenden stoppt die Aufzeichnung." data-en="Outdoors the iPhone can record your route with GPS, also while the screen is locked. Pausing or finishing stops the recording."></dd>
    <dt data-de="Schwimmen" data-en="Swimming"></dt>
    <dd data-de="Für das Becken wählst du 25 m oder 50 m. Die Apple Watch zählt die Bahnen; öffne ClimbRhythm auf der Watch, bevor du ins Wasser gehst. Ohne Watch trägst du die Bahnen danach ein." data-en="For the pool you choose 25 m or 50 m. The Apple Watch counts your lengths; open ClimbRhythm on the Watch before you get in the water. Without a Watch you enter the lengths afterwards."></dd>
  </dl>
</section>

<section>
  <h2 data-de="Apple Watch" data-en="Apple Watch"></h2>
  <p data-de="Die Watch zeigt die laufende Session und steuert sie: Versuch starten und beenden, bewerten, Satz oder Timer starten, pausieren. Sie misst den Puls und gibt die Timer-Signale am Handgelenk. Die Session selbst startest du am iPhone; das iPhone sollte in Reichweite sein." data-en="The Watch shows the running session and controls it: start and stop an attempt, rate it, start a set or timer, pause. It measures your heart rate and gives the timer signals on your wrist. You start the session on the iPhone; keep the iPhone within reach."></p>
  <div class="shots one">
    <figure class="watch"><img data-shot="watch" width="416" height="496" alt="" loading="lazy"><figcaption data-de="Laufende Boulder-Session auf der Watch" data-en="Running bouldering session on the Watch"></figcaption></figure>
  </div>
</section>

<section>
  <h2 data-de="Zyklen" data-en="Cycles"></h2>
  <p data-de="Ein Zyklus ist ein Zeitraum mit Zielen: wie oft du welche Sportart trainieren willst. Du findest die Zyklen über die Startseite; dort siehst du auch, was im laufenden Zyklus schon geschafft ist." data-en="A cycle is a period with goals: how often you want to train which sport. You reach your cycles from the start screen, which also shows what you have already done in the current cycle."></p>
  <div class="shots one">
    <figure><img data-shot="planning" width="480" height="1044" alt="" loading="lazy"><figcaption data-de="Zyklus mit Kalender, Zielen und Einheiten" data-en="Cycle with calendar, goals and workouts"></figcaption></figure>
  </div>
  <dl>
    <dt data-de="Planen" data-en="Plan"></dt>
    <dd data-de="Mit + legst du Beginn, Dauer und Ziele fest, zum Beispiel 2 Wochen mit 1 × Kraft, 3 × Klettern, 1 × Bouldern, 1 × Hangboard und 2 × Laufen. Zyklen überschneiden sich nicht; ein neuer kann direkt an den vorigen anschließen." data-en="With + you set start, length and goals, for example 2 weeks with 1 × strength, 3 × climbing, 1 × bouldering, 1 × hangboard and 2 × running. Cycles do not overlap; a new one can follow straight after the previous one."></dd>
    <dt data-de="Einheiten" data-en="Workouts"></dt>
    <dd data-de="Zu jedem Ziel kannst du Einheiten mit Übungen, Sätzen und Timern vorbereiten. Tippe auf eine Einheit, um sie direkt als Session zu starten; die Übungen sind dann sofort da." data-en="For each goal you can prepare workouts with exercises, sets and timers. Tap a workout to start it as a session right away; its exercises are ready at once."></dd>
    <dt data-de="Kalender" data-en="Calendar"></dt>
    <dd data-de="Grün sind die Tage eines Zyklus, dunkel ist heute. Tippe einen Tag an, um seinen Zyklus zu sehen; „Heute“ springt zurück." data-en="Green days belong to a cycle, the dark one is today. Tap a day to see its cycle; “Today” jumps back."></dd>
    <dt data-de="Pause" data-en="Pause"></dt>
    <dd data-de="Bei Krankheit oder Urlaub trägst du eine Pause ein. Der Zyklus hält an und verlängert sich um die Pausentage, die folgenden Zyklen verschieben sich. Trainings an Pausentagen bleiben im Verlauf, zählen aber nicht zum Ziel." data-en="When you are ill or away, enter a pause. The cycle stops and is extended by the paused days, and the following cycles move back. Sessions on paused days stay in your history but do not count towards the goal."></dd>
    <dt data-de="Erinnerungen" data-en="Reminders"></dt>
    <dd data-de="Auf Wunsch erinnert dich die App an deine Ziele, zum Beispiel zur Zyklusmitte. Während einer Pause kommen keine Erinnerungen." data-en="If you like, the app reminds you of your goals, for example at the middle of a cycle. No reminders are sent during a pause."></dd>
    <dt data-de="Teilen" data-en="Share"></dt>
    <dd data-de="Aus einem Zyklus erstellst du eine Bildkarte mit deinem Fortschritt, zum Beispiel für Social Media oder zum Verschicken." data-en="From a cycle you create an image card showing your progress, for example for social media or to send to someone."></dd>

<script>
(function(){
  var lang="de";
  try{lang=localStorage.getItem("lang")||((navigator.language||"de").slice(0,2)==="de"?"de":"en")}catch(e){lang=(navigator.language||"de").slice(0,2)==="de"?"de":"en"}
  function show(l){
    lang=l;document.documentElement.lang=l;
    document.querySelectorAll("[data-de]").forEach(function(n){n.textContent=n.getAttribute("data-"+l)});
    document.querySelectorAll("img[data-shot]").forEach(function(n){n.src="img/"+n.getAttribute("data-shot")+"-"+l+".jpg";var c=n.parentNode.querySelector("figcaption");n.alt=c?c.textContent:""});
    document.getElementById("lang-de").setAttribute("aria-pressed",l==="de");
    document.getElementById("lang-en").setAttribute("aria-pressed",l==="en");
    try{localStorage.setItem("lang",l)}catch(e){}
  }
  document.getElementById("lang-de").addEventListener("click",function(){show("de")});
  document.getElementById("lang-en").addEventListener("click",function(){show("en")});
  show(lang);
})();
</script>
